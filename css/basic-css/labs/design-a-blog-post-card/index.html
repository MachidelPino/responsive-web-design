<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="blog-post-card">
        <div class="post-content">
            <img class="post-img" alt="landscape" src="https://static.vecteezy.com/system/resources/thumbnails/003/623/626/small/sunset-lake-landscape-illustration-free-vector.jpg">
            <h2 class="post-title">Landscape</h2>
            <p class="post-excerpt">
                A stylized sunset landscape with purple mountains, a calm lake, pine trees, and dark foliage in the foreground.
            </p>
            <a class="read-more" href="https://es.vecteezy.com/vectores-gratis/paisaje">Read More</a>
        </div>
    </div>
</body>
</html>
