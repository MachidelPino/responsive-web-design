<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="profile image">
        <p class="full-name">[Full Name]</p>
        <p class="designation">[Designation]</p>
        <p class="company">[Company]</p>
        <hr>
        <p>[Email address]</p>
        <p>[Phone Number]</p>
        <a class="portfolio-link" href="https://github.com/MachidelPino">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="x.com">Twitter</a>
            <a href="https://www.linkedin.com/in/marcos-del-pino-871a4a173/">LinkedIn</a>
            <a href="https://github.com/MachidelPino">GitHub</a>
        </div>
    </div>
</body>

</html>
