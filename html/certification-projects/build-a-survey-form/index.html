<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset ="utf-8">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve</p>
    <form id="survey-form">
      <label id="name-label">Name <input id="name" type="text" placeholder="Enter your name" required></label>

      <label id="email-label">Email <input id="email" type="email" placeholder="Enter your email" required></label>

      <label id="number-label">Number <input id="number" type="number" min="8" max="10" placeholder="Enter your number" required></label>

      <select id="dropdown">
        <option></option>
        <option></option>
      </select>

      <input type="radio" value="1" name="radiobutton">
      <input type="radio" value="2" name="radiobutton">

      <input type="checkbox" value="1">
      <input type="checkbox" value="2">

      <textarea></textarea>

      <input id="submit" type="submit" value="Submit">
    </form>
  </body>
  <footer>

  </footer>
</html>
